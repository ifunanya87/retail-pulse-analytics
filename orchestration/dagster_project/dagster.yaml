storage:
  sqlite:
    base_dir: /workspaces/retail-pulse-analytics/orchestration/dagster_project

retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 30

run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
    tag_concurrency_limits:
      - key: "dagster/backfill"
        limit: 1
