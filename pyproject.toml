[project]
name = "retail-pulse-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.0",
    "dagster-pipes>=1.13.0",
    "dagster-webserver>=1.13.0",
    "dlt[gs]>=1.25.0",
    # "google-cloud-storage>=3.10.1",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    # "python-dotenv>=1.2.2",
    "google-cloud-storage",
    "python-dotenv",
    "requests>=2.28.0,<2.32.0",
    "dagster-dbt",
    "dbt-bigquery",
    "dagster_dlt",
    "jupyter>=1.1.1",
    "gcsfs>=2025.12.0",
    "fsspec>=2025.12.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "streamlit>=1.56.0",
    "google-cloud-bigquery>=3.41.0",
    "db-dtypes>=1.4.4",
    "plotly>=6.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
