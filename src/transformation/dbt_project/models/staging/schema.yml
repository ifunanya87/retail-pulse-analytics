version: 2

models:
  - name: stg_iowa_liquor__sales
    description: "Staged Iowa Liquor Sales data. Standardized column names and casted types from the raw source."
    columns:
      - name: invoice_id
        description: "Primary key for the sales table (renamed from invoice_line_no)."
        data_tests:
          - unique
          - not_null

      - name: transaction_date
        description: "The date the transaction occurred."
        data_tests:
          - not_null

      - name: store_id
        description: "The unique ID for the store."
        data_tests:
          - not_null

      - name: sale_dollars
        description: "The total dollar amount of the sale (casted to float64)."
        data_tests:
          - not_null

      - name: sale_bottles
        description: "Number of bottles sold (casted to int64)."

      - name: _dlt_id
        description: "Metadata ID from the DLT ingestion process."
        data_tests:
          - unique
          - not_null
          